[project]
name = "sudoku-scanner-ml"
version = "0.1.0"
description = "Local training and evaluation tooling for MICHI printed Sudoku recognition"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<2.2",
  "opencv-python-headless==4.10.0.84",
  "Pillow==11.3.0",
  "PyYAML==6.0.2",
  "tensorflow==2.21.0",
]

[dependency-groups]
dev = ["pytest==8.4.1", "ruff==0.12.9"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sudoku_scanner_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
