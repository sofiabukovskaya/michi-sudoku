name: michi_workspace
publish_to: none
environment:
  sdk: ^3.11.0

workspace:
  - apps/mobile
  - packages/sudoku_engine
  - packages/sudoku_scanner
  - packages/michi_design_system

dev_dependencies:
  melos: ^7.2.0

melos:
  scripts:
    analyze:
      run: dart run melos exec -c 1 -- "flutter analyze --no-pub"
      description: Analyze every workspace package.
    test:
      run: |
        set -e
        dart run melos exec -c 1 --depends-on=flutter_test -- "flutter test --no-pub"
        dart run melos exec --depends-on=test -- "dart test"
      description: Run every workspace test suite.
    format:
      run: >-
        dart format
        apps/mobile/lib apps/mobile/test apps/mobile/tool
        packages/sudoku_engine/lib packages/sudoku_engine/test packages/sudoku_engine/tool
        packages/sudoku_scanner/lib packages/sudoku_scanner/test packages/sudoku_scanner/tool
        packages/michi_design_system/lib packages/michi_design_system/test
      description: Format Dart sources in the workspace.
    generate:
      run: dart run melos exec --depends-on=build_runner -- "dart run build_runner build"
      description: Generate routes, DI, models, translations and themes.
