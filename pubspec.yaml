name: michi_workspace
publish_to: none
environment:
  sdk: ^3.11.0

workspace:
  - apps/mobile
  - packages/sudoku_engine
  - packages/sudoku_scanner
  - packages/michi_design_system

dev_dependencies:
  melos: ^7.2.0

melos:
  scripts:
    analyze:
      run: melos exec -c 1 -- "flutter analyze --no-pub"
      description: Analyze every workspace package.
    test:
      run: |
        set -e
        melos exec -c 1 --depends-on=flutter_test -- "flutter test --no-pub"
        melos exec --depends-on=test -- "dart test"
      description: Run every workspace test suite.
    format:
      run: dart format .
      description: Format Dart sources in the workspace.
    generate:
      run: melos exec --depends-on=build_runner -- "dart run build_runner build"
      description: Generate routes, DI, models, translations and themes.
