name: michi_design_system
description: MICHI design tokens and reusable Flutter primitives.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.11.0
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  lottie: ^3.8.2
  theme_tailor_annotation: ^3.1.1
dev_dependencies:
  build_runner: ^2.10.5
  flutter_test:
    sdk: flutter
  theme_tailor: 3.1.1
  very_good_analysis: ^10.2.0
flutter:
  # Motion Library V2.1: only the Lottie JSON is shipped (no previews/tools).
  assets:
    - assets/mascot/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-wght.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-wght.ttf
        # True italic (OFL, same license file): the splash tagline and
        # other italic editorial text no longer use a synthesized slant.
        - asset: assets/fonts/Lora-Italic-wght.ttf
          style: italic
