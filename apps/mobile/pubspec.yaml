name: michi_mobile
description: MICHI Sudoku Coach for iOS and Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.0
resolution: workspace

dependencies:
  auto_route: ^10.2.3
  camera: ^0.12.2
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  crypto: ^3.0.7
  drift: ^2.31.0
  drift_flutter: 0.2.8
  firebase_analytics: ^13.0.1
  firebase_app_check: ^0.5.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  firebase_crashlytics: ^6.0.1
  firebase_remote_config: ^7.0.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_timezone: ^5.1.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  google_sign_in: ^7.2.0
  image_picker: ^1.2.4
  injectable: ^2.7.1+4
  json_annotation: ^4.9.0
  michi_design_system:
    path: ../../packages/michi_design_system
  permission_handler: ^12.0.3
  provider: ^6.1.5
  shared_preferences: ^2.5.6
  slang: ^4.19.0
  slang_flutter: ^4.19.0
  sudoku_engine:
    path: ../../packages/sudoku_engine
  sudoku_scanner:
    path: ../../packages/sudoku_scanner

dev_dependencies:
  auto_route_generator: 10.2.6
  bdd_widget_test: ^3.0.4
  bloc_test: ^10.0.0
  build_runner: ^2.10.5
  drift_dev: 2.31.0
  flutter_test:
    sdk: flutter
  freezed: 3.2.3
  injectable_generator: 2.9.0
  json_serializable: 6.11.2
  mocktail: ^1.0.4
  shared_preferences_platform_interface: ^2.4.2
  slang_build_runner: ^4.19.0
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/puzzles/classic_v1.json
    - assets/practice/practice_v1.json
    - assets/images/coach_mascot.png
    - assets/images/splash_mascot.png
    - assets/images/completion_hero.png
    - assets/images/hint_icon.png
    - assets/images/michi_calm.png
    - assets/images/michi_pointing.png
    - assets/images/michi_happy.png
    - assets/images/michi_notebook.png
