targets:
  $default:
    builders:
      slang_build_runner:
        enabled: false
      # Slang's supported disk writer handles committed translation outputs.
      # The default fan-out builder fails with "Asset already exists".
      slang_build_runner:legacy:
        enabled: true
        options:
          base_locale: uk
          fallback_strategy: base_locale
          input_directory: lib/core/localization/i18n
          input_file_pattern: .i18n.json
          output_directory: lib/core/localization
          output_file_name: translations.g.dart
          lazy: false
          locale_handling: true
          flutter_integration: true
      bdd_widget_test|featureBuilder:
        options:
          customHeaders:
            - "import 'package:flutter_test/flutter_test.dart';"
